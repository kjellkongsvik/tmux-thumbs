[package]
name = "thumbs"
version = "0.9.0"
authors = ["Kjell W. Kongsvik <kjellkongsvik@gmail.com>"]
edition = "2024"
description = "A tmux-thumbs fork without tmux"
repository = "https://github.com/kjellkongsvik/thumbs"
keywords = ["rust", "zellij", "tmux", "tmux-fingers", "vimium", "vimperator"]
license = "MIT"

[dependencies]
termion = "4.0.6"
regex = "1.12.3"
clap = "4.6.0"
unicode-width = "0.2.2"

[[bin]]
name = "thumbs"
path = "src/main.rs"
